<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>实时投票系统</title>
</head>

<body>

<div style="position:absolute; top:12px; right:16px;">
    当前账号：<strong id="currentUser">未登录</strong>
</div>

<h2>WebSocket 实时投票系统</h2>

房间号：
<input id="room"/>
<button onclick="enterRoom()">进入房间</button>

<hr>

<div id="main" style="display:none">

    在线人数：
    <span id="online">0</span>

    <br><br>

    <button onclick="startVote()">开始投票</button>
    <button onclick="stopVote()">结束投票</button>

    <br><br>

    <button onclick="vote(1)">选项1</button>
    <button onclick="vote(2)">选项2</button>
    <button onclick="vote(3)">选项3</button>

    <h3>投票结果</h3>

    <div>选项1：<span id="c1">0</span></div>
    <div>选项2：<span id="c2">0</span></div>
    <div>选项3：<span id="c3">0</span></div>

</div>

<script>

    let ws;

    loadCurrentUser();

    function loadCurrentUser(){
        fetch("/me")
            .then(r=>{
                if(!r.ok){
                    throw new Error("unauthorized")
                }
                return r.json()
            })
            .then(user=>{
                document.getElementById("currentUser").innerText = user.username;
                sessionStorage.setItem("role", user.role);
            })
            .catch(()=>{
                alert("请先登录后再进入投票页面");
                location = "login.html";
            })
    }

    function enterRoom(){

        let room=document.getElementById("room").value || "default";

        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${protocol}://${location.host}/ws?roomId=${encodeURIComponent(room)}`;

        ws=new WebSocket(wsUrl);

        ws.onopen=function(){
            document.getElementById("main").style.display="block";
        }

        ws.onerror=function(){
            alert("WebSocket连接失败，请确认已登录");
        }

        ws.onmessage=function(e){

            if(e.data==="already"){
                alert("你已经投过票了");
                return;
            }

            if(e.data==="forbidden"){
                alert("只有管理员可以开始或结束投票");
                return;
            }

            let data=JSON.parse(e.data);

            document.getElementById("c1").innerText=data.result[1]||0;
            document.getElementById("c2").innerText=data.result[2]||0;
            document.getElementById("c3").innerText=data.result[3]||0;

            document.getElementById("online").innerText=data.online;

        };

    }

    function vote(option){

        ws.send(JSON.stringify({
            command:"vote",
            option:option
        }));

    }

    function startVote(){

        ws.send(JSON.stringify({
            command:"start"
        }));

    }

    function stopVote(){

        ws.send(JSON.stringify({
            command:"stop"
        }));

    }

</script>

</body>

</html>
