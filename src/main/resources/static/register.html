<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 实时投票系统</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef2ff 45%, #e8f7ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,.92);
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .12);
            padding: 28px;
        }
        h2 { margin: 0 0 6px; font-size: 28px; }
        .sub { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
        .field { margin-bottom: 14px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #4b5563; }
        input {
            width: 100%;
            height: 42px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            transition: .2s border-color, .2s box-shadow;
            background: #fff;
        }
        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, .12);
        }
        button {
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .footer {
            margin-top: 16px;
            font-size: 14px;
            color: #6b7280;
            text-align: center;
        }
        .footer a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h2>创建账号</h2>
    <p class="sub">注册后即可登录并加入投票房间。</p>

    <div class="field">
        <label for="username">用户名</label>
        <input id="username" placeholder="请输入用户名">
    </div>

    <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码">
    </div>

    <button onclick="register()">注册</button>

    <div class="footer">
        已有账号？<a href="login.html">返回登录</a>
    </div>
</div>

<script>

    function register(){

        fetch("/register",{
            method:"POST",
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:"username="+encodeURIComponent(username.value)+"&password="+encodeURIComponent(password.value)
        })
            .then(r=>r.text())
            .then(d=>{

                if(d==="success"){
                    alert("注册成功")
                    location="login.html"
                }else if(d==="exist"){
                    alert("用户名已存在")
                }

            })

    }

</script>
</body>
</html>
